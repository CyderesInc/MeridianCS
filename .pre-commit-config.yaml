default_language_version:
  node: "22.22.2"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^assets/fonts/.*\.txt$
      - id: end-of-file-fixer
        exclude: ^assets/fonts/.*\.txt$
      - id: mixed-line-ending
        exclude: ^assets/fonts/.*\.txt$
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-json
      - id: check-yaml
      - id: check-ast

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--select=F, --fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        files: ^(scripts|evals)/.*\.py$

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # docs-pii needs pass_filenames: false. Given single files it runs every pattern, ALLCAPS
  # included, and ignores its sweep exemptions.
  - repo: local
    hooks:
      - id: docs-pii
        name: docs-pii (no real identifiers in tracked text)
        entry: uv run --locked --project scripts/tools scripts/tools/check-docs-pii.py
        language: system
        pass_filenames: false
        always_run: true
      - id: sbom-current
        name: sbom.cdx.json is current
        entry: uv run --locked --project scripts/tools scripts/tools/make-sbom.py --check
        language: system
        pass_filenames: false
        always_run: true
      # Offline, so the verdict depends only on the files.
      - id: zizmor
        name: zizmor (GitHub Actions security)
        entry: uv run --locked --project scripts/tools zizmor --offline .github
        language: system
        pass_filenames: false
        files: ^\.github/
