# The offline suite has been CI-safe by design since its first commit (deterministic, no network,
# exit 0/1) — but nothing ran it automatically, and that is exactly how v2.7.0 shipped broken: the
# frontmatter length check existed, and no merge ever executed it. This workflow closes that gap.
#
# Linux here; Windows in ci-windows.yml. The suite has platform-conditional paths a single runner
# never exercises -- POSIX 0600 permission assertions and fcntl locking run only on Linux; the msvcrt
# byte-range lock, cp1252 console handling, and Windows path behavior run only on Windows. Windows
# bills at about twice the Linux rate and a path filter is per workflow, so it lives in its own file,
# runs on every push to main, and on PRs only when they touch code or CI. That file says why.
# Actions are pinned to commit SHAs, not tags: a tag can be re-pointed by whoever controls the
# action's repo, which is how the tj-actions compromise reached every workflow trusting `@v<N>`.
name: CI

# Draft PRs are skipped (each job's `if:`), so `ready_for_review` is listed: without it a draft
# marked ready would get no run until its next push. Skipped jobs are not billed.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Read-only, declared here rather than inherited. Installs update themselves from the public repo's
# latest release, so anything that can create a release can ship code to every install -- and a
# workflow on `main` inherits whatever the repo default token allows. Only release.yml writes. The repo default is now read
# too, but a file that states it survives a settings change, and a fork of this repo inherits it.
permissions:
  contents: read

# A new push to a PR branch cancels that PR's run still in progress: its result describes a commit
# nobody will merge. Runs on `main` are never cancelled -- a merge to main is a live deploy, and
# every one of them should have a finished result, including one superseded by the next merge.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every checkout sets persist-credentials: false. By default checkout writes the job token into the
# runner's git config so later steps can push; nothing here pushes, so that only leaves a token on
# disk for any step (or compromised action) to read. The token is read-only, but it is still a token.

# The uv project for all tooling, including the offline suite, lives in scripts/tools/.
env:
  UV_PROJECT: scripts/tools

jobs:
  offline-suite:
    name: offline-suite (ubuntu-latest)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The release group brings hvac, so the suite exercises the signer too.
      - name: Offline test suite
        run: uv run --locked --group release pytest evals
      # The skill promises Python 3.9+ (README) and nothing else would prove it. Only the test group
      # resolves for 3.9; test_skill_is_stdlib_only keeps those dependencies out of meridian.py.
      - name: Offline test suite on the skill's Python floor
        if: ${{ !cancelled() }}
        run: uv run --locked --python 3.9 --no-default-groups --group test pytest evals

  repo-checks:
    # One job for the quick Linux checks, not one each. On a private repo Actions minutes are
    # metered, and each job is billed rounded up to a whole minute; each of these runs in seconds.
    # Every step after the first runs even if an earlier one failed (`!cancelled()`), so a PR still
    # gets every verdict from one run. pre-commit goes last because its fixer hooks rewrite files in
    # the workspace when they fail, and the checks before it should see the tree exactly as committed.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: "tooling: tests"
        run: uv run --locked pytest scripts/tools/tests

      - name: "package: builds"
        if: ${{ !cancelled() }}
        run: uv run --locked scripts/tools/make-package.py --label ci --out-dir "$RUNNER_TEMP"
      - name: "package: is one that is safe to ship"
        if: ${{ !cancelled() }}
        run: uv run --locked scripts/tools/verify-package.py "$RUNNER_TEMP/meridiancs.ci.skill.zip"

      # Only where the reviewed public variants exist: a derived tree already substituted them.
      - name: "public tree: derives with a clean audit"
        if: ${{ !cancelled() && hashFiles('README.public.md') != '' }}
        run: uv run --locked scripts/tools/make-public.py "$RUNNER_TEMP/public"

      - name: "pre-commit: hooks pass on every file"
        if: ${{ !cancelled() }}
        run: uv run --locked --group dev pre-commit run --all-files --show-diff-on-failure
