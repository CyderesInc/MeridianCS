name: Feature request
description: A question the skill can't answer yet, or something it should do differently.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the question or task, not your environment: no tokens, hostnames or inventory data.
  - type: textarea
    id: want
    attributes:
      label: What you want to ask or do
      description: Ideally the question you'd put to Claude, as you'd phrase it.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: What the skill answers or does instead, if anything.
